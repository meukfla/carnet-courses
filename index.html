<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Courses">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="icon" type="image/png" href="icon.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}

<title>Mon carnet de courses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Mise en page : une colonne étroite (mobile d'abord), en-tête simple, barre d'onglets fixe en bas, panneaux qui montent du bas pour tout ce qui se saisit. */
:root{
  --bg:#B1D9AC;            /* Pantone 13-6226 TCX Frosted Lime : fond */
  --surface:#EFF7EC;
  --surface2:#D4EACF;
  --fg:#1E3322;
  --muted:#3F5C46;
  --line:#93C28D;
  --line-strong:#5E8F63;
  --accent:#F5BEC7;        /* Pantone 13-2006 TCX Almond Blossom : boutons */
  --accent-fg:#3A1B25;
  --accent-ink:#8A2D49;
  --accent-soft:#D9EDD5;
  --note-bg:#FBE0E5;
  --note-fg:#56212F;
  --danger:#A3263A;
  --danger-soft:#FBDCDF;
  --scrim:rgba(20,40,25,.45);
  color-scheme:light;
  --font-display:"Space Grotesk","Inter",system-ui,sans-serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--fg);font:400 16px/1.45 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(92px + env(safe-area-inset-bottom,0px));
  min-height:100vh;
}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent-ink);outline-offset:2px;border-radius:8px}
#app{max-width:640px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}

/* en-tête */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 0 10px}
.top h1{font-size:1.75rem;font-weight:600;letter-spacing:-.01em;line-height:1.15}
.top p{margin:2px 0 0;color:var(--muted);font-size:.9rem}

/* boutons */
.btn{border:1.5px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:10px 16px;min-height:44px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent-ink);color:var(--accent-fg);font-weight:600}
.btn.small{min-height:36px;padding:6px 12px;font-size:.9rem}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.btn:disabled{opacity:.5}
.ico{display:grid;place-items:center;width:44px;height:44px;border:0;background:transparent;border-radius:10px;color:var(--muted);flex:none}
.ico:hover{background:var(--surface2)}
.ico svg,.ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:7px 14px;min-height:38px;font-size:.95rem}
.chip.on{background:var(--accent);border-color:var(--accent-ink);color:var(--accent-fg)}
.chip.ghost{border-style:dashed;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px;min-height:40px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 0 var(--line)}

/* cartes et lignes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{font-size:1.05rem;font-weight:600}
.card .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.note-card{background:var(--note-bg);border-color:transparent;color:var(--note-fg)}
.note-card .hd h3{color:var(--note-fg)}
.note-card .btn{background:transparent;border-color:currentColor;color:inherit}
.note-card .btn.on{background:var(--note-fg);color:var(--note-bg);border-color:var(--note-fg)}
.hab{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0;min-width:0}
.hab span{min-width:0;overflow-wrap:anywhere;font-weight:500}
.hab .btn{min-height:42px;padding:6px 14px;font-size:.92rem;flex:none}
.muted{color:var(--muted)}
.empty{color:var(--muted);padding:18px 4px;text-align:center}
.notice{background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin-bottom:12px;display:grid;gap:8px}
.notice p{margin:0}
.notice .acts{display:flex;flex-wrap:wrap;gap:8px}
.modebar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;flex:1;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent-ink);border-radius:99px}
.progress{display:flex;align-items:center;gap:10px;flex:1;min-width:0;color:var(--muted);font-size:.9rem}

form.addrow{display:flex;gap:8px;flex-wrap:wrap}
input[type=text],input[type=search],input[type=url],select,textarea{
  width:100%;min-height:46px;border:1.5px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:9px 12px;font-size:16px}
textarea{min-height:84px;resize:vertical}
form.addrow input[type=text]{flex:1 1 180px;width:auto;min-width:0}
form.addrow select{flex:1 1 140px;width:auto;min-width:0}
.fields{display:grid;gap:10px}
.fields label{display:grid;gap:4px;font-size:.88rem;color:var(--muted)}
.sugg{margin-top:10px}
.sugg:empty{display:none}
.ask{margin-top:12px;display:grid;gap:8px}
.ask p{margin:0;font-weight:500}

/* liste par rayon */
.aisle{margin-bottom:10px}
.ah{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:10px 4px;text-align:left;font-family:var(--font-display);font-weight:600;font-size:1rem;letter-spacing:.01em}
.ah span:first-child{flex:1;min-width:0}
.ah .cnt{font-family:var(--font-body);font-weight:500;font-size:.85rem;color:var(--muted)}
.ah svg{width:20px;height:20px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.ah[aria-expanded=false] svg{transform:rotate(-90deg)}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:4px;min-height:54px;padding:0 4px 0 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.rl{display:flex;align-items:center;gap:14px;flex:1;min-width:0;padding:8px 0;cursor:pointer}
.nm{min-width:0;overflow-wrap:anywhere}
.nm small{display:block;color:var(--muted);font-size:.8rem;line-height:1.3}
.row.done .nm{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-strong)}
.row.done .nm small{text-decoration:none}
.row.over{background:var(--danger-soft)}
.row.over .nm small{color:var(--danger);font-weight:500}
.row .lk{font-size:.85rem;color:var(--accent-ink);padding:8px;font-weight:500}
.cb{appearance:none;-webkit-appearance:none;width:26px;height:26px;margin:0;border:2px solid var(--line-strong);border-radius:8px;background:var(--surface);flex:none;display:grid;place-items:center;cursor:pointer}
.cb:checked{background:var(--accent);border-color:var(--accent-ink)}
.cb:checked::after{content:"";width:6px;height:12px;border:solid var(--accent-fg);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.store .row{min-height:64px}
.store .nm{font-size:1.25rem}
.store .cb{width:32px;height:32px;border-radius:10px}
.store .cb:checked::after{width:8px;height:15px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.actions .btn{flex:1 1 140px}

/* recettes */
.rc h3{font-size:1.1rem}
.rc .meta{margin:2px 0 6px;color:var(--muted);font-size:.85rem}
.rc .ingl{margin:0 0 10px;color:var(--fg);font-size:.92rem;overflow-wrap:anywhere}
.rc .tip{margin:0 0 8px;font-size:.92rem;color:var(--muted)}
.rc .acts{display:flex;flex-wrap:wrap;gap:8px}
.rc .acts .btn:first-child{flex:1 1 160px}
.star{color:var(--line-strong)}
.star.on{color:#c9890a}
.star.on svg{fill:currentColor}
.badge{display:inline-block;font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;background:var(--surface2);color:var(--muted);border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:2px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.day.today{border-color:var(--accent-ink);border-width:2px}
.day h3{font-size:1rem;margin-bottom:8px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{display:grid;gap:2px;text-align:left;border:1.5px dashed var(--line-strong);background:transparent;border-radius:10px;padding:8px 10px;min-height:58px;min-width:0}
.slot.filled{border-style:solid;background:var(--accent-soft);border-color:transparent}
.slot .sl{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.slot .sv{font-weight:500;overflow-wrap:anywhere}
.ing{display:grid;grid-template-columns:1fr auto;gap:6px;margin-bottom:8px;align-items:center}
.ing .ing-a{grid-column:1/2}
.ing .ico{grid-row:1/3;grid-column:2}

/* historique */
.hist .hh{width:100%;display:flex;align-items:center;gap:10px;justify-content:space-between;border:0;background:transparent;text-align:left;padding:0;min-height:44px}
.hist .hh b{font-family:var(--font-display);font-weight:600;text-transform:capitalize}
.hist .hh small{color:var(--muted)}
.hist .body{margin-top:10px;display:grid;gap:10px}
.top-row{display:grid;grid-template-columns:minmax(0,1fr) 72px 30px;align-items:center;gap:10px;padding:5px 0}
.top-row button{border:0;background:transparent;text-align:left;padding:6px 0;font-weight:500;min-height:36px;overflow-wrap:anywhere}
.top-row .n{text-align:right;color:var(--muted);font-size:.9rem}

/* panneau */
#sheet{position:fixed;inset:0;z-index:30}
.backdrop{position:absolute;inset:0;background:var(--scrim)}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:88vh;max-width:640px;margin:0 auto;background:var(--bg);border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 8px 6px 16px;flex:none}
.ph h2{font-size:1.15rem;font-weight:600}
.pb{overflow:auto;padding:4px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));-webkit-overflow-scrolling:touch}
.pb .sub{font-size:.95rem;margin:16px 0 8px}
ul.plain{list-style:none;margin:0 0 12px;padding:0}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 0 2px 2px;border-bottom:1px solid var(--line)}
.hrow span{min-width:0;overflow-wrap:anywhere}
.hrow small{display:block;color:var(--muted);font-size:.8rem}
.arow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:4px;align-items:center;margin-bottom:8px}
.arow input{min-width:0}
.pbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pbtns .btn{flex:1 1 140px}
.chk-line{display:flex;align-items:center;gap:12px;margin:12px 0;cursor:pointer}

/* barre d'onglets */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
#tabs .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:640px;margin:0 auto;gap:2px}
.tab{display:grid;justify-items:center;gap:2px;border:0;background:transparent;border-radius:12px;padding:6px 2px;min-height:56px;color:var(--muted);font-size:.72rem;font-weight:500}
.tab.on{color:var(--accent-fg);background:var(--accent);font-weight:600}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--fg);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:.92rem;max-width:min(90vw,420px);text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>

var LS="carnet-courses-v1",LSUI="carnet-courses-ui-v1";

function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}

var pending=null,sheet=null,sync="local",remote=null,dirty=false,pushing=false,pushTimer=null,adoptLater=null;

function commit(){S.rev=Date.now();saveLocal();schedulePush(250);render()}
function schedulePush(ms){if(!remote)return;dirty=true;clearTimeout(pushTimer);pushTimer=setTimeout(push,ms)}
function push(){
  if(pushing||!remote||!dirty)return;
  pushing=true;dirty=false;
  var done=function(ok){
    pushing=false;
    if(!ok){dirty=true;sync="err";refreshSync();setTimeout(function(){schedulePush(0)},15000)}
    else{sync="ok";refreshSync();if(dirty)schedulePush(250)}
  };
  try{remote.set({rev:S.rev,data:JSON.parse(JSON.stringify(S))}).then(function(){done(true)},function(){done(false)})}catch(e){done(false)}
}
function typingNow(){var a=document.activeElement;return !!a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.type!=="checkbox"}
function adopt(d){
  var nd=migrate(d.data);nd.rev=d.rev;
  if(typingNow()){adoptLater=nd;return}
  S=nd;saveLocal();render();
}
document.addEventListener("focusout",function(){
  setTimeout(function(){if(adoptLater&&!typingNow()){S=adoptLater;adoptLater=null;saveLocal();render()}},50);
});
function syncTxt(){return sync==="err"||sync==="slow"?" · non synchronisé":sync==="nodb"?" · enregistré sur cet appareil seulement":sync==="ok"?" · sauvegardé":""}
function flush(){if(remote){clearTimeout(pushTimer);dirty=true;push()}}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden"&&dirty)flush()});
window.addEventListener("pagehide",function(){if(dirty)flush()});
function refreshSync(){$("#sub").textContent=subtitle()+syncTxt();if(sheet&&sheet.type==="settings")renderSheet()}
(function initRemote(){
  try{
    if(!window.claude||!window.claude.use){sync="nodb";return}
    window.claude.use("db").then(function(db){
      if(!db){sync="nodb";refreshSync();return null}
      return Promise.resolve().then(function(){
        remote=db.doc("carnet/state");
        var slow=setTimeout(function(){if(sync!=="ok"){sync="slow";refreshSync()}},10000);
        remote.onSnapshot(function(snap){
          if(snap.metadata.hasPendingWrites)return;
          var d=snap.exists?snap.data():null;
          if(d&&d.data&&typeof d.rev==="number"&&d.rev>S.rev){adopt(d)}
          else if(!snap.metadata.fromCache&&(!d||!d.data||d.rev<S.rev)){schedulePush(0)}
          if(!snap.metadata.fromCache){sync="ok";clearTimeout(slow);refreshSync()}
        },function(){sync="err";refreshSync()});
      });
    }).catch(function(){});
  }catch(e){}
})();

function aisleOk(a){return S.aisles.some(function(x){return x.id===a})?a:"autres"}
function aisleName(id){var a=S.aisles.filter(function(x){return x.id===id})[0];return a?a.name:"Autres"}
function pool(){
  var m=new Map();
  SEEDS.forEach(function(p){m.set(norm(p[0]),{n:p[0],a:p[1]})});
  S.recipes.forEach(function(r){r.ings.forEach(function(i){if(i.n)m.set(norm(i.n),{n:i.n,a:i.a})})});
  S.habituals.forEach(function(h){m.set(norm(h.name),{n:h.name,a:h.aisle})});
  Object.keys(S.known).forEach(function(k){m.set(k,{n:S.known[k].n,a:S.known[k].a})});
  return m;
}
function guess(name){var p=pool().get(norm(name));return p?aisleOk(p.a):null}
function addItem(name,aisle,hab){
  name=cap(name);if(!name)return "no";
  var k=norm(name);aisle=aisleOk(aisle);
  S.known[k]={n:name,a:aisle};
  var ex=S.current.items.filter(function(i){return norm(i.name)===k})[0];
  if(ex){if(ex.done){ex.done=false;return "back"}return "dup"}
  S.current.items.push({id:uid(),name:name,aisle:aisle,done:false,hab:hab||null});
  return "added";
}
function addMany(list){
  var c={added:0,dup:0,back:0};
  list.forEach(function(p){var r=addItem(p[0],p[1]);if(c[r]!==undefined)c[r]++});
  commit();
  var n=c.added+c.back;
  toast(n+(n>1?" produits ajoutés":" produit ajouté")+(c.dup?" ("+c.dup+" déjà dans la liste)":""));
}
function inList(name){var k=norm(name);return S.current.items.some(function(i){return norm(i.name)===k})}
function habOn(h){var k=norm(h.name);return S.current.items.some(function(i){return i.hab===h.id||norm(i.name)===k})}
function autoHabits(){
  var cnt=new Map();
  S.history.forEach(function(h){
    var seen=new Set();
    h.items.forEach(function(it){var k=norm(it[0]);if(seen.has(k))return;seen.add(k);var c=cnt.get(k)||{n:it[0],a:it[1],c:0};c.c++;cnt.set(k,c)});
  });
  var have=new Set(S.habituals.map(function(h){return norm(h.name)}));
  cnt.forEach(function(v,k){
    if(v.c>=3&&!have.has(k)&&S.dismissed.indexOf(k)<0){
      var h={id:uid(),name:v.n,aisle:aisleOk(v.a)};S.habituals.push(h);S.newHabs.push(h.id);
    }
  });
}
function removeHabitual(id){
  var h=S.habituals.filter(function(x){return x.id===id})[0];if(!h)return;
  var k=norm(h.name);if(S.dismissed.indexOf(k)<0)S.dismissed.push(k);
  S.habituals=S.habituals.filter(function(x){return x.id!==id});
  S.newHabs=S.newHabs.filter(function(x){return x!==id});
  S.current.items.forEach(function(i){if(i.hab===id)i.hab=null});
}
function newList(keep){
  var items=S.current.items;
  if(items.length){
    S.history.unshift({id:uid(),date:new Date().toISOString(),items:items.map(function(i){return [i.name,i.aisle,i.done?1:0]})});
    S.history=S.history.slice(0,100);
    autoHabits();
  }
  var carry=keep?items.filter(function(i){return !i.done}):[];
  S.current={id:uid(),items:carry.map(function(i){return {id:uid(),name:i.name,aisle:i.aisle,done:false,hab:i.hab||null}})};
}

    commit();
  },
  "t-did":function(el){var t=find(S.tasks,el.dataset.id);if(t){t.prev=t.last;t.last=today();commit();toast("Noté pour aujourd'hui")}},
  "t-new":function(){openSheet("task",{})},
  "t-edit":function(el){openSheet("task",{id:el.dataset.id})},
  "t-del":function(el){S.tasks=S.tasks.filter(function(t){return t.id!==el.dataset.id});sheet=null;commit()},
  ent:function(el){
    var n=el.dataset.n;
    if(inList(n)){toast("Déjà dans la liste");return}
    addItem(n,"entretien");commit();toast(n+" ajouté à la liste");
  },
  "ent-edit":function(){ui.entEdit=!ui.entEdit;saveUI();render()},
  "ent-del":function(el){S.entretien=S.entretien.filter(function(n){return n!==el.dataset.n});commit()},
  dsec:function(el){ui.dsec=el.dataset.id;saveUI();render()},
  "sec-new":function(){openSheet("section",{})},
  "sec-edit":function(){openSheet("section",{id:curSec().id})},
  "sec-del":function(el){S.divers.sections=S.divers.sections.filter(function(s){return s.id!==el.dataset.id});ui.dsec=null;sheet=null;commit()},
  "g-toggle":function(el){var s=curSec(),i=find(s.items,el.dataset.id);if(i){i.bought=el.checked;commit()}},
  "g-del":function(el){var s=curSec();s.items=s.items.filter(function(i){return i.id!==el.dataset.id});commit()},
  "n-toggle":function(el){var s=curSec(),i=find(s.items,el.dataset.id);if(i){i.done=el.checked;commit()}},
  "n-del":function(el){var s=curSec();s.items=s.items.filter(function(i){return i.id!==el.dataset.id});commit()},
  "h-open":function(el){ui.hopen=ui.hopen===el.dataset.id?null:el.dataset.id;saveUI();render()},
  "h-add1":function(el){var r=addItem(el.dataset.n,el.dataset.a);commit();toast(r==="dup"?"Déjà dans la liste":cap(el.dataset.n)+" ajouté")},
  "h-addall":function(el){var l=find(S.history,el.dataset.id);if(l)addMany(l.items.map(function(it){return [it[0],it[1]]}))},
  "h-del":function(el){S.history=S.history.filter(function(l){return l.id!==el.dataset.id});if(ui.hopen===el.dataset.id)ui.hopen=null;commit()},
  "copy-data":function(){
    var txt=JSON.stringify(S),box=$("#copy-box");
    var fallback=function(){box.innerHTML='<div class="fields" style="margin-top:10px"><label>Sélectionne et copie ce texte<textarea id="copy-text" readonly></textarea></label></div>';var ta=$("#copy-text");ta.value=txt;ta.focus();ta.select()};
    try{navigator.clipboard.writeText(txt).then(function(){toast("Données copiées")},fallback)}catch(e){fallback()}
  },
  restore:function(){
    var ta=$("#restore-text"),v=ta?ta.value.trim():"";
    try{
      var o=JSON.parse(v);
      if(!o||!Array.isArray(o.aisles)||!o.current)throw new Error("format");
      S=migrate(o);sheet=null;commit();toast("Données restaurées");
    }catch(e){toast("Ces données ne sont pas valides")}
  },
  reset:function(){S=defaults();ui.collapsed={};sheet=null;commit();toast("Tout est remis à zéro")}
};
function focusAdd(){setTimeout(function(){var i=$("#add-in");if(i)i.focus()},0)}

document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");if(!el)return;
  if(el.disabled)return;
  if(el.dataset.confirm&&!el.classList.contains("armed")){e.preventDefault();arm(el);return}
  var f=A[el.dataset.act];if(f)f(el,e);
});

/* ---------- formulaires ---------- */
var F={
  add:function(f){
    var inp=f.elements.n,name=cap(inp.value);if(!name)return;
    var g=guess(name);
    if(g){addItem(name,g);pending=null;commit();focusAdd()}
    else{pending=name;render();var s=$("#sugg");if(s)s.scrollIntoView({block:"nearest"})}
  },
  "ent-add":function(f){
    var n=cap(f.elements.n.value);if(!n)return;
    if(!S.entretien.some(function(x){return norm(x)===norm(n)}))S.entretien.push(n);
    S.known[norm(n)]={n:n,a:"entretien"};commit();
    var i=$("#ent-n");if(i)i.focus();
  },
  "hab-add":function(f){
    var n=cap(f.elements.n.value),a=f.elements.a.value,k=norm(n);if(!n)return;
    if(!S.habituals.some(function(h){return norm(h.name)===k}))S.habituals.push({id:uid(),name:n,aisle:aisleOk(a)});
    S.dismissed=S.dismissed.filter(function(x){return x!==k});S.known[k]={n:n,a:aisleOk(a)};commit();
    var i=$("#hab-n");if(i)i.focus();
  },
  "aisle-add":function(f){
    var n=cap(f.elements.n.value);if(!n)return;
    S.aisles.splice(Math.max(S.aisles.length-1,0),0,{id:"a"+uid(),name:n});commit();
  },
  "recipe-save":function(f){
    var name=cap(f.elements.n.value);if(!name)return;
    var ings=[];f.querySelectorAll(".ing").forEach(function(row){
      var n=cap(row.querySelector(".ing-n").value);if(n)ings.push({n:n,a:aisleOk(row.querySelector(".ing-a").value)});
    });
    var id=sheet&&sheet.data.id,r=id?find(S.recipes,id):null;
    if(r){r.name=name;r.notes=f.elements.notes.value.trim();r.ings=ings;r.example=false}
    else S.recipes.unshift({id:uid(),name:name,notes:f.elements.notes.value.trim(),fav:false,example:false,ings:ings});
    ings.forEach(function(i){S.known[norm(i.n)]={n:i.n,a:i.a}});
    sheet=null;commit();
  },
  "task-save":function(f){
    var n=cap(f.elements.n.value),fr=f.elements.f.value;if(!n)return;
    var id=sheet&&sheet.data.id,t=id?find(S.tasks,id):null;
    if(t){t.name=n;t.freq=fr}else S.tasks.push({id:uid(),name:n,freq:fr,last:null,prev:null,created:today()});
    sheet=null;commit();
  },
  "sec-save":function(f){
    var n=cap(f.elements.n.value);if(!n)return;
    var id=sheet&&sheet.data.id,s=id?find(S.divers.sections,id):null;
    if(s)s.name=n;else{s={id:"s"+uid(),name:n,type:"notes",items:[]};S.divers.sections.push(s);ui.dsec=s.id;saveUI()}
    sheet=null;commit();
  },
  "gift-add":function(f){
    var idea=cap(f.elements.idea.value);if(!idea)return;
    var s=curSec();
    s.items.unshift({id:uid(),idea:idea,who:cap(f.elements.who.value),occ:cap(f.elements.occ.value),link:f.elements.link.value.trim(),bought:false});
    commit();toast("Idée ajoutée");
  },
  "note-add":function(f){
    var t=cap(f.elements.t.value);if(!t)return;
    curSec().items.unshift({id:uid(),text:t,done:false});commit();
    var i=$("#n-text");if(i)i.focus();
  }
};
document.addEventListener("submit",function(e){
  var f=e.target.closest("[data-form]");if(!f)return;
  e.preventDefault();var h=F[f.dataset.form];if(h)h(f);
});

/* saisie : suggestions, recherche de recettes, ingrédients, noms de rayons */
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="add-in"){
    var q=norm(t.value),box=$("#sugg");if(!box)return;
    if(!q){box.innerHTML="";return}
    var out=[];
    pool().forEach(function(v,k){if(k.indexOf(q)>=0&&!inList(v.n))out.push({v:v,s:k.indexOf(q)===0?0:1})});
    out.sort(function(a,b){return a.s-b.s||a.v.n.localeCompare(b.v.n,"fr")});
    box.innerHTML=out.slice(0,6).map(function(o){return '<button type="button" class="chip" data-act="sugg" data-n="'+esc(o.v.n)+'" data-a="'+esc(aisleOk(o.v.a))+'">'+esc(o.v.n)+"</button>"}).join("");
  }else if(t.id==="rq"){
    ui.rq=t.value;saveUI();var l=$("#rlist");if(l)l.innerHTML=recipeListHtml();
  }
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.classList&&t.classList.contains("ing-n")){
    var row=t.closest(".ing"),sel=row&&row.querySelector(".ing-a");
    if(sel&&!sel.dataset.touched){var g=guess(t.value);if(g)sel.value=g}
  }else if(t.classList&&t.classList.contains("ing-a")){t.dataset.touched="1"}
  else if(t.classList&&t.classList.contains("a-name")){
    var a=find(S.aisles,t.dataset.id),n=cap(t.value);
    if(a&&n&&n!==a.name){a.name=n;commit()}
  }
});

render();
})();
</script>
